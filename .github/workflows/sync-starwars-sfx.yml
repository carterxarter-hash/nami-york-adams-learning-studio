name: Sync Star Wars SFX assets

on:
  push:
    paths:
      - '.github/workflows/sync-starwars-sfx.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download split Star Wars SFX assets
        shell: bash
        run: |
          set -euo pipefail
          base='https://nami-york-adams-learning-studio-zloo78.v2.appdeploy.ai/resources/sw-sfx'
          mkdir -p public/resources/sw-sfx
          curl --fail --location --retry 3 --user-agent 'Mozilla/5.0' "$base/archives.json" -o public/resources/sw-sfx/archives.json
          for n in $(seq -w 1 16); do
            curl --fail --location --retry 3 --user-agent 'Mozilla/5.0' "$base/part-$n.zip" -o "public/resources/sw-sfx/part-$n.zip"
          done
          ls -lh public/resources/sw-sfx

      - name: Commit synchronized assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT deployment sync'
          git config user.email 'actions@users.noreply.github.com'
          git add public/resources/sw-sfx
          if git diff --cached --quiet; then
            echo 'Assets already synchronized.'
            exit 0
          fi
          git commit -m 'Add split Star Wars SFX assets for Netlify'
          git push
