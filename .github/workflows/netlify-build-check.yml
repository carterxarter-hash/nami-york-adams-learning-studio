name: Validate Learning Studio production

on:
  push:
    paths:
      - '.github/workflows/**'
      - 'index.html'
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'vite.config.ts'
      - 'netlify.toml'
      - 'package*.json'
  workflow_dispatch:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production site
        env:
          COMMIT_REF: ${{ github.sha }}
        run: npm run build

      - name: Verify production output
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/build-meta.json
          test -f dist/learning-studio-v3.js
          test -f dist/starwars-music-browser.js
          test -f dist/resources/sw-video/rotation-v1.json
          test -f dist/resources/sw-video/background-package-2026-10-07-01.mp4
          test -f dist/resources/sw-audio/sounds.json
          grep -q "${GITHUB_SHA:0:12}" dist/build-meta.json
          ! grep -q '__BUILD_ID__' dist/sw.js
          du -sh dist

      - name: Run release smoke test
        run: node tests/release-smoke.mjs

      - name: Run Star Wars audio regression test
        run: node tests/starwars-audio-browser.mjs

      - name: Upload verified build
        uses: actions/upload-artifact@v4
        with:
          name: learning-studio-production-dist
          path: dist/
          compression-level: 0
          retention-days: 7
