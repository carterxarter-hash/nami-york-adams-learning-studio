name: Validate Learning Studio production build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build production site
        run: npm run build
      - name: Run consolidation smoke checks
        run: npm run test:ci
      - name: Verify production output
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/build-meta.json
          test -f dist/manifest.webmanifest
          test -f dist/studio-consolidation.js
          test -f dist/starwars-music-browser.js
          test -f dist/starwars-background-rotation.js
          test -f dist/resources/starwars-music/tracks-v1.json
          test -f dist/resources/sw-video/rotation-v1.json
          test -f dist/resources/sw-audio/sounds.json
          node --input-type=module -e "import fs from 'node:fs'; const m=JSON.parse(fs.readFileSync('dist/resources/sw-audio/sounds.json')); const c=JSON.parse(fs.readFileSync('scripts/starwars-audio-catalog.json')); if(m.version!==2 || m.entries.length!==c.entries.length || m.entries.some((e,i)=>e.file!==c.entries[i].file || e.pool!==c.entries[i].pool || !fs.existsSync('dist/resources/sw-audio/'+e.file))) process.exit(1);"
          du -sh dist
          echo 'Verified Learning Studio shell, Story Mode consolidation, media rotation, and audio library.'
      - name: Upload verified production build
        uses: actions/upload-artifact@v4
        with:
          name: netlify-production-dist
          path: dist/
          compression-level: 0
          retention-days: 7
