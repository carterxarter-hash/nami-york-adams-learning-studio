name: Validate Netlify production build

on:
  push:
    paths:
      - '.github/workflows/netlify-build-check.yml'
      - 'index.html'
      - 'sw.js'
      - 'scripts/**'
      - 'package*.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build production site
        run: npm run build

      - name: Verify production output
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          test -f dist/icons/icon-180.png
          test -f dist/icons/icon-192.png
          test -f dist/icons/icon-512.png
          test -f dist/resources/sw-audio/sounds.json
          node --input-type=module -e "import fs from 'node:fs'; const m=JSON.parse(fs.readFileSync('dist/resources/sw-audio/sounds.json')); const c=JSON.parse(fs.readFileSync('scripts/starwars-audio-catalog.json')); if(m.version!==2 || m.entries.length!==c.entries.length || m.entries.some((e,i)=>e.file!==c.entries[i].file || e.pool!==c.entries[i].pool || !fs.existsSync('dist/resources/sw-audio/'+e.file))) process.exit(1);"
          du -sh dist
          echo 'Verified full PWA shell and individually playable Star Wars audio.'

      - name: Upload verified Netlify build
        uses: actions/upload-artifact@v4
        with:
          name: netlify-production-dist
          path: dist/
          compression-level: 0
          retention-days: 7
